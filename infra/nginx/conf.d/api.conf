# ===========================================
# API 站点配置（api.yourbrand.com）
# 上游：Go API 容器（8888）
# 前置：Cloudflare（CDN + WAF），Nginx 此处只做反代与终止
# ===========================================
upstream shop_api {
    server api:8888 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourbrand.com;

    # 健康检查与 ACME 校验不走跳转
    location /.well-known/ {
        root /var/www/certbot;
    }

    location /healthz {
        proxy_pass http://shop_api;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.yourbrand.com;

    # ------- 证书 -------
    # 方案 A（推荐，已用 Cloudflare）：Cloudflare 源证书，SSL/TLS 设为 Full(strict)
    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    # 方案 B：Let's Encrypt（certbot 签发）
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ------- 安全头 -------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------- 限流 -------
    limit_conn conn_limit 50;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # 健康检查
    location /healthz {
        proxy_pass http://shop_api;
        access_log off;
    }

    # 支付回调：不缓存、放宽超时、放宽限流
    location /api/v1/webhooks/ {
        proxy_pass http://shop_api;
        proxy_read_timeout 60s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后台登录：严格限流
    location /api/v1/admin/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://shop_api;
    }

    # 下单：中等限流
    location /api/v1/orders {
        limit_req zone=order_limit burst=10 nodelay;
        proxy_pass http://shop_api;
    }

    location / {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://shop_api;
    }
}
