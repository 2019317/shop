user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------- 日志格式（含 traceId，便于排障）----------
    log_format main '$remote_addr - $request_id [$time_iso8601] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---------- 性能 ----------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ---------- 上传限制（制品图/详情图）----------
    client_max_body_size 20m;
    client_body_timeout  30s;
    client_header_timeout 30s;

    # ---------- 限流：API 全局 + 登录/下单 更严格 ----------
    # 小内存机型已将 zone 压至 1m（约可存 1.6 万 IP），避免占用过多共享内存
    limit_req_zone $binary_remote_addr zone=api_limit:1m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:1m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=order_limit:1m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:1m;

    include /etc/nginx/conf.d/*.conf;
}
